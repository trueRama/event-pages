<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MIIC Events and Launches - Stay updated with the latest MIIC events, product launches, and announcements">
    <title>MIIC Events and Launches</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>MIIC Events & Launches</h1>
            <p class="subtitle">Stay updated with the latest MIIC events and product launches</p>
        </div>
    </header>

    <main class="container">
        <section class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="event">Events</button>
            <button class="filter-btn" data-filter="launch">Launches</button>
        </section>

        <section id="events-container" class="events-grid">
            <!-- Events will be dynamically loaded here -->
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 MIIC. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
